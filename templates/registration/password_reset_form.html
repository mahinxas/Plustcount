{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset password</h1>
<p class="muted">Enter your work email. If it belongs to an account, we send a reset link.</p>
<form method="post">{% csrf_token %}{% include "_field.html" with field=form.email %}<button class="btn btn-primary" type="submit">Send reset link</button></form>
<p class="small" style="margin:16px 0 0"><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
